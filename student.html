<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ученик - Кибер Кахут</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: #0f0;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        .error {
            color: #ff4444;
            text-align: center;
            padding: 10px;
            border: 1px solid #ff4444;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success {
            color: #0f0;
            text-align: center;
            padding: 10px;
            border: 1px solid #0f0;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="joinCard" class="card">
            <h1>🧑‍🎓 ВХОД</h1>
            <input type="text" id="playerName" placeholder="Твоё имя">
            <input type="text" id="gameCode" placeholder="Код игры">
            <button onclick="joinGame()">🔌 ПОДКЛЮЧИТЬСЯ</button>
            <div id="message"></div>
        </div>

        <div id="waitingCard" class="card hidden">
            <h1>⏳ ОЖИДАНИЕ</h1>
            <p style="text-align:center;">Ждите начала игры...</p>
        </div>
    </div>

    <script>
        window.joinGame = async function() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('gameCode').value.trim();
            const msg = document.getElementById('message');
            
            if (!name || !code) {
                msg.innerHTML = '<div class="error">Введите имя и код</div>';
                return;
            }
            
            try {
                const { error } = await APP_SUPABASE
                    .from('players')
                    .insert({
                        game_code: code,
                        name: name,
                        score: 0,
                        answered: false,
                        joined_at: Date.now()
                    });
                
                if (error) throw error;
                
                document.getElementById('joinCard').classList.add('hidden');
                document.getElementById('waitingCard').classList.remove('hidden');
                
            } catch (e) {
                msg.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
            }
        };
    </script>
</body>
</html>
