<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ученик - Кибер Кахут</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 30px;
        }
        h1 { text-align: center; }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 5px;
        }
        button {
            background: #0f0;
            color: #000;
            cursor: pointer;
        }
        .hidden { display: none; }
        .error { color: #ff4444; }
        .question {
            background: #000;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .option {
            border: 1px solid #0f0;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            text-align: center;
        }
        .option:hover { background: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <div id="joinCard" class="card">
            <h1>🧑‍🎓 ВХОД</h1>
            <input type="text" id="playerName" placeholder="Имя">
            <input type="text" id="gameCode" placeholder="Код игры">
            <button onclick="joinGame()">🔌 ПОДКЛЮЧИТЬСЯ</button>
            <div id="error" class="error"></div>
        </div>

        <div id="waitingCard" class="card hidden">
            <h1>⏳ ОЖИДАНИЕ</h1>
            <p>Ждите начала игры...</p>
        </div>

        <div id="gameCard" class="card hidden">
            <h3>Вопрос <span id="questionNum">1</span></h3>
            <div id="questionText" class="question"></div>
            <div id="options"></div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 0 },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2 },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1 }
        ];

        let gameCode = null;
        let playerName = null;
        let interval = null;
        let currentQuestion = null;

        async function joinGame() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('gameCode').value;
            
            try {
                const { error } = await APP_SUPABASE
                    .from('players')
                    .insert({
                        game_code: code,
                        name: name,
                        score: 0,
                        answered: false,
                        joined_at: Date.now()
                    });
                
                if (error) throw error;
                
                gameCode = code;
                playerName = name;
                
                document.getElementById('joinCard').classList.add('hidden');
                document.getElementById('waitingCard').classList.remove('hidden');
                
                interval = setInterval(checkGameStatus, 2000);
                
            } catch (e) {
                document.getElementById('error').innerText = e.message;
            }
        }

        async function checkGameStatus() {
            try {
                const { data, error } = await APP_SUPABASE
                    .from('games')
                    .select('status, current_question')
                    .eq('code', gameCode)
                    .single();
                
                if (error) throw error;
                
                if (data.status === 'active' && data.current_question) {
                    clearInterval(interval);
                    showQuestion(data.current_question);
                }
            } catch (e) {}
        }

        function showQuestion(questionId) {
            const question = QUESTIONS.find(q => q.id === questionId);
            if (!question) return;
            
            currentQuestion = question;
            
            document.getElementById('waitingCard').classList.add('hidden');
            document.getElementById('gameCard').classList.remove('hidden');
            document.getElementById('questionNum').innerText = questionId;
            document.getElementById('questionText').innerText = question.text;
            
            let html = '';
            question.options.forEach((opt, i) => {
                html += `<div class="option" onclick="answer(${i})">${opt}</div>`;
            });
            document.getElementById('options').innerHTML = html;
        }

        async function answer(index) {
            if (!currentQuestion) return;
            
            const isCorrect = (index === currentQuestion.correct);
            alert(isCorrect ? '✅ Правильно!' : '❌ Неправильно');
        }
    </script>
</body>
</html>
