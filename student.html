<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ученик - Кибер Кахут</title>
    <!-- ═══════════════════════════════════════════════════════════════════════
         ПОДКЛЮЧЕНИЕ БИБЛИОТЕК
         - font-awesome: иконки
         - google fonts: шрифты
         - supabase: работа с базой данных
         - config.js: наши настройки (с уникальным QUIZ_ID)
         ═══════════════════════════════════════════════════════════════════════ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         СТИЛИ - оформление страницы ученика
         Здесь можно менять цвета, размеры, анимации
         ═══════════════════════════════════════════════════════════════════════ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0a;
            color: #0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid #0f0;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        .logo {
            font-size: 60px;
            text-align: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px #0f0);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }
        
        input {
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            color: #0f0;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 30px #0f0;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 16px;
            color: #0f0;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 30px #0f0;
        }
        
        .info-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0f0;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .question-header {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
        }
        
        .question-text {
            font-size: 1.5rem;
            margin: 30px 0;
            text-align: center;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }
        
        .option {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
        }
        
        .option:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px #0f0;
        }
        
        .option.selected {
            background: rgba(0, 255, 0, 0.2);
        }
        
        .option-letter {
            width: 40px;
            height: 40px;
            background: #0f0;
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        
        .status {
            text-align: center;
            padding: 20px;
            border-radius: 16px;
        }
        
        .status.correct { 
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
            color: #0f0;
        }
        
        .status.wrong { 
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .status.waiting {
            background: rgba(255, 255, 0, 0.1);
            border: 1px solid yellow;
            color: yellow;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 0, 0.3);
            border-top: 3px solid #0f0;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden { display: none; }
        
        /* ═══════════════════════════════════════════════════════════════════
           СТИЛИ ДЛЯ ЛИДЕРБОРДА (ТАБЛИЦЫ РЕЗУЛЬТАТОВ)
           - Пьедестал для топ-3
           - Список остальных игроков
           - Анимации
           ═══════════════════════════════════════════════════════════════════ */
        .leaderboard {
            margin: 20px 0;
        }
        
        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin: 30px 0;
            padding: 20px 0;
        }
        
        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }
        
        .podium-1 { order: 2; }
        .podium-2 { order: 1; }
        .podium-3 { order: 3; }
        
        .podium-place {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .podium-1 .podium-place {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 30px #ffd700;
        }
        
        .podium-2 .podium-place {
            background: #c0c0c0;
            color: #000;
            box-shadow: 0 0 30px #c0c0c0;
        }
        
        .podium-3 .podium-place {
            background: #cd7f32;
            color: #000;
            box-shadow: 0 0 30px #cd7f32;
        }
        
        .podium-name {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .podium-score {
            font-size: 1.3rem;
        }
        
        .podium-1 .podium-score {
            color: #ffd700;
        }
        
        .podium-2 .podium-score {
            color: #c0c0c0;
        }
        
        .podium-3 .podium-score {
            color: #cd7f32;
        }
        
        .players-table {
            margin-top: 30px;
        }
        
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }
        
        .player-rank {
            font-weight: bold;
            margin-right: 15px;
        }
        
        .player-name {
            font-size: 1.1rem;
            flex: 1;
        }
        
        .player-score {
            font-size: 1.2rem;
            color: #0f0;
            font-weight: bold;
        }
        
        .top-3-divider {
            margin: 20px 0;
            text-align: center;
            color: #0f0;
            opacity: 0.5;
        }
        
        .celebration {
            text-align: center;
            margin: 20px 0;
            font-size: 3rem;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ═══════════════════════════════════════════════════════════════════
             ЭКРАН 1: ВХОД
             Ученик вводит имя и код игры
             ═══════════════════════════════════════════════════════════════════ -->
        <div id="joinScreen" class="screen active">
            <div class="logo">🛡️</div>
            <h1>КИБЕР КАХУТ</h1>
            <div id="errorContainer"></div>
            <input type="text" id="playerName" placeholder="Твоё имя">
            <input type="text" id="gameCode" placeholder="Код игры">
            <button id="joinButton" class="btn">🔌 ПОДКЛЮЧИТЬСЯ</button>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             ЭКРАН 2: ОЖИДАНИЕ
             Ученик ждёт начала игры
             ═══════════════════════════════════════════════════════════════════ -->
        <div id="waitingScreen" class="screen">
            <div class="logo">⏳</div>
            <h2>ОЖИДАНИЕ...</h2>
            <div class="loader"></div>
            <div class="info-box">
                <div class="info-item">
                    <span>Участник:</span>
                    <strong id="displayName">-</strong>
                </div>
                <div class="info-item">
                    <span>Код:</span>
                    <strong id="displayCode">-</strong>
                </div>
                <div class="info-item">
                    <span>Очки:</span>
                    <strong id="displayScore">0</strong>
                </div>
            </div>
            <button onclick="leaveGame()" class="btn">🚪 ВЫЙТИ</button>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             ЭКРАН 3: ВОПРОС
             Ученик отвечает на вопросы
             ═══════════════════════════════════════════════════════════════════ -->
        <div id="questionScreen" class="screen">
            <div class="question-header">
                <span>КИБЕРБЕЗОПАСНОСТЬ</span>
                <span id="questionCounter">1/5</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="status waiting" id="answerStatus">⏳ Выбери ответ</div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             ЭКРАН 4: ЛИДЕРБОРД (РЕЗУЛЬТАТЫ)
             Показывается после завершения игры
             Содержит пьедестал для топ-3 и список остальных
             ═══════════════════════════════════════════════════════════════════ -->
        <div id="leaderboardScreen" class="screen">
            <div class="celebration">🎉</div>
            <h2>ИТОГИ ИГРЫ</h2>
            <div class="leaderboard" id="leaderboard"></div>
            <button onclick="playAgain()" class="btn">🔄 ИГРАТЬ СНОВА</button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         СКРИПТ - вся логика работы ученика
         Здесь происходит:
         - Подключение к игре (с фильтром по quiz_id)
         - Ожидание начала
         - Получение вопросов от учителя
         - Отправка ответов
         - Получение результатов
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // МАССИВ ВОПРОСОВ - ДОЛЖЕН СОВПАДАТЬ С teacher.html
        // ═══════════════════════════════════════════════════════════════════════
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 1, points: 1 },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2, points: 1 },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1, points: 1 },
            { id: 4, text: "Что такое VPN?", options: ["Вирус", "Частная сеть", "Пароль", "Антивирус"], correct: 1, points: 1 },
            { id: 5, text: "Что такое бэкап?", options: ["Копия", "Удаление", "Вирус", "Игра"], correct: 0, points: 1 }
        ];

        // ═══════════════════════════════════════════════════════════════════════
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ═══════════════════════════════════════════════════════════════════════
        let gameCode = null;              // Код текущей игры
        let playerName = null;            // Имя игрока
        let currentQuestion = null;       // Текущий вопрос
        let hasAnswered = false;          // Ответил ли уже на текущий вопрос
        let pollInterval = null;          // Интервал проверки статуса игры
        let playerScore = 0;              // Очки игрока
        let currentQuestionId = null;     // ID текущего вопроса
        let isQuestionScreenActive = false; // Активен ли экран вопроса
        let gameCompleted = false;         // Завершена ли игра

        // ═══════════════════════════════════════════════════════════════════════
        // ПОЛУЧЕНИЕ ЭЛЕМЕНТОВ DOM
        // ═══════════════════════════════════════════════════════════════════════
        const joinButton = document.getElementById('joinButton');
        const errorContainer = document.getElementById('errorContainer');
        const playerNameInput = document.getElementById('playerName');
        const gameCodeInput = document.getElementById('gameCode');

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: showError() - отображение ошибки
        // ═══════════════════════════════════════════════════════════════════════
        function showError(msg) {
            errorContainer.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => errorContainer.innerHTML = '', 3000);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: switchScreen() - переключение между экранами
        // ═══════════════════════════════════════════════════════════════════════
        function switchScreen(screen) {
            ['join', 'waiting', 'question', 'leaderboard'].forEach(s => {
                document.getElementById(s + 'Screen').classList.remove('active');
            });
            document.getElementById(screen + 'Screen').classList.add('active');
            
            if (screen === 'question') {
                isQuestionScreenActive = true;
            } else {
                isQuestionScreenActive = false;
            }
            
            if (screen === 'leaderboard') {
                loadLeaderboard();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: loadLeaderboard() - загрузка таблицы результатов
        // Получает всех игроков, сортирует по очкам и отображает
        // Топ-3 на пьедестале, остальные в списке
        // ═══════════════════════════════════════════════════════════════════════
        async function loadLeaderboard() {
            if (!gameCode) return;
            
            try {
                // Получаем всех игроков, отсортированных по баллам
                const { data: players, error } = await SB
                    .from('players')
                    .select('name, score')
                    .eq('game_code', gameCode)
                    .order('score', { ascending: false });
                
                if (error) throw error;
                
                const leaderboardDiv = document.getElementById('leaderboard');
                
                if (!players || players.length === 0) {
                    leaderboardDiv.innerHTML = '<p>Нет участников</p>';
                    return;
                }
                
                // Разделяем на топ-3 и остальных
                const top3 = players.slice(0, 3);
                const others = players.slice(3);
                
                let html = '';
                
                // Пьедестал для топ-3
                if (top3.length > 0) {
                    html += '<div class="podium">';
                    
                    // Расставляем в правильном порядке (2-1-3)
                    const podiumOrder = [1, 0, 2]; // индексы для 2-го, 1-го, 3-го места
                    
                    podiumOrder.forEach((idx, position) => {
                        if (idx < top3.length) {
                            const player = top3[idx];
                            const place = idx + 1;
                            const placeClass = place === 1 ? 'podium-1' : place === 2 ? 'podium-2' : 'podium-3';
                            
                            html += `
                                <div class="podium-item ${placeClass}">
                                    <div class="podium-place">${place}</div>
                                    <div class="podium-name">${player.name}</div>
                                    <div class="podium-score">${player.score}</div>
                                </div>
                            `;
                        }
                    });
                    
                    html += '</div>';
                }
                
                // Остальные игроки
                if (others.length > 0) {
                    html += '<div class="top-3-divider">──────────</div>';
                    html += '<div class="players-table">';
                    
                    others.forEach((player, index) => {
                        const rank = index + 4; // начиная с 4-го места
                        html += `
                            <div class="player-row">
                                <span class="player-rank">#${rank}</span>
                                <span class="player-name">${player.name}</span>
                                <span class="player-score">${player.score}</span>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
                
                leaderboardDiv.innerHTML = html;
                
            } catch (e) {
                console.error('Ошибка загрузки лидерборда:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ОБРАБОТЧИК КНОПКИ ПОДКЛЮЧЕНИЯ
        // 1. Проверяет введённые данные
        // 2. Добавляет игрока в таблицу players с полем game_code
        // 3. Переключает на экран ожидания
        // 4. Запускает проверку статуса игры
        // ═══════════════════════════════════════════════════════════════════════
        joinButton.addEventListener('click', async () => {
            const name = playerNameInput.value.trim();
            const code = gameCodeInput.value.trim();
            
            if (!name || !code) {
                showError("Введите имя и код");
                return;
            }
            
            try {
                const { error } = await SB
                    .from('players')
                    .insert({
                        game_code: code,
                        name: name,
                        score: 0,
                        answered: false,
                        joined_at: Date.now()
                    });
                
                if (error) throw error;
                
                gameCode = code;
                playerName = name;
                
                document.getElementById('displayName').innerText = name;
                document.getElementById('displayCode').innerText = code;
                switchScreen('waiting');
                
                // Проверяем статус игры каждые 2 секунды
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(checkGameStatus, 2000);
                
            } catch (e) {
                showError(e.message);
            }
        });

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: checkGameStatus() - проверка статуса игры
        // Запрашивает из базы информацию о текущей игре
        // В зависимости от статуса:
        // - 'active' с новым вопросом → показываем вопрос
        // - 'finished' → показываем лидерборд
        // ═══════════════════════════════════════════════════════════════════════
        async function checkGameStatus() {
            if (!gameCode) return;
            
            try {
                const { data, error } = await SB
                    .from('games')
                    .select('status, current_question')
                    .eq('code', gameCode)
                    .single();
                
                if (error) {
                    console.log('Игра не найдена или ошибка:', error.message);
                    return;
                }
                
                if (data) {
                    // Если игра завершена и мы не показывали лидерборд
                    if (data.status === 'finished' && !gameCompleted) {
                        gameCompleted = true;
                        clearInterval(pollInterval);
                        switchScreen('leaderboard');
                    }
                    // Если игра активна и есть текущий вопрос
                    else if (data.status === 'active' && data.current_question) {
                        // Если это новый вопрос (отличается от текущего)
                        if (data.current_question !== currentQuestionId) {
                            console.log('Новый вопрос:', data.current_question);
                            currentQuestionId = data.current_question;
                            hasAnswered = false;
                            loadQuestion(data.current_question);
                            switchScreen('question');
                        }
                    } 
                    // Если игра больше не активна, но мы на экране вопроса
                    else if (data.status !== 'active' && isQuestionScreenActive && !gameCompleted) {
                        console.log('Игра завершена, показываем лидерборд');
                        gameCompleted = true;
                        clearInterval(pollInterval);
                        switchScreen('leaderboard');
                    }
                }
            } catch (e) {
                console.error('Ошибка при проверке игры:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: loadQuestion() - загрузка вопроса
        // Отображает текст вопроса и варианты ответов
        // ═══════════════════════════════════════════════════════════════════════
        function loadQuestion(questionId) {
            const question = QUESTIONS.find(q => q.id === questionId);
            if (!question) return;
            
            currentQuestion = question;
            
            document.getElementById('questionText').innerText = question.text;
            document.getElementById('questionCounter').innerText = `${questionId}/${QUESTIONS.length}`;
            
            const optionsHtml = question.options.map((opt, i) => `
                <div class="option" onclick="selectAnswer(${i})">
                    <div class="option-letter">${String.fromCharCode(65 + i)}</div>
                    <div>${opt}</div>
                </div>
            `).join('');
            document.getElementById('optionsContainer').innerHTML = optionsHtml;
            document.getElementById('answerStatus').innerHTML = '⏳ Выбери ответ';
            document.getElementById('answerStatus').className = 'status waiting';
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: selectAnswer() - выбор ответа
        // 1. Проверяет правильность
        // 2. Сохраняет ответ в таблицу answers
        // 3. Обновляет счёт игрока в таблице players
        // 4. Показывает результат
        // ═══════════════════════════════════════════════════════════════════════
        window.selectAnswer = async (index) => {
            if (hasAnswered || !currentQuestion || !gameCode || !playerName) return;
            
            hasAnswered = true;
            
            // Подсвечиваем выбранный вариант
            document.querySelectorAll('.option').forEach((opt, i) => {
                if (i === index) opt.classList.add('selected');
            });
            
            const isCorrect = (index === currentQuestion.correct);
            
            const statusDiv = document.getElementById('answerStatus');
            statusDiv.textContent = isCorrect ? "✅ ПРАВИЛЬНО!" : "❌ НЕПРАВИЛЬНО";
            statusDiv.className = isCorrect ? "status correct" : "status wrong";
            
            try {
                // Сохраняем ответ
                const { error: answerError } = await SB
                    .from('answers')
                    .insert({
                        game_code: gameCode,
                        question_id: currentQuestion.id,
                        player_name: playerName,
                        answer_index: index,
                        is_correct: isCorrect,
                        answered_at: Date.now()
                    });
                
                if (answerError) throw answerError;
                
                if (isCorrect) {
                    playerScore += currentQuestion.points;
                    document.getElementById('displayScore').innerText = playerScore;
                    
                    // Обновляем счёт игрока
                    await SB
                        .from('players')
                        .update({ 
                            score: playerScore, 
                            answered: true 
                        })
                        .eq('game_code', gameCode)
                        .eq('name', playerName);
                } else {
                    // Отмечаем что игрок ответил
                    await SB
                        .from('players')
                        .update({ answered: true })
                        .eq('game_code', gameCode)
                        .eq('name', playerName);
                }
                
            } catch (e) {
                console.error('Ошибка сохранения ответа:', e);
                hasAnswered = false;
            }
        };

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: leaveGame() - выход из игры
        // Возвращает на экран входа
        // ═══════════════════════════════════════════════════════════════════════
        window.leaveGame = () => {
            if (pollInterval) clearInterval(pollInterval);
            resetGameState();
            switchScreen('join');
        };

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: playAgain() - играть снова
        // Возвращает на экран входа
        // ═══════════════════════════════════════════════════════════════════════
        window.playAgain = () => {
            resetGameState();
            switchScreen('join');
        };

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: resetGameState() - сброс состояния игры
        // ═══════════════════════════════════════════════════════════════════════
        function resetGameState() {
            gameCode = null;
            playerName = null;
            currentQuestion = null;
            hasAnswered = false;
            currentQuestionId = null;
            playerScore = 0;
            isQuestionScreenActive = false;
            gameCompleted = false;
            playerNameInput.value = '';
            gameCodeInput.value = '';
            document.getElementById('displayScore').innerText = '0';
        }
    </script>
</body>
</html>
