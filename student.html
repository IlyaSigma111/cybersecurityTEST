<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ученик - Кибер Кахут</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0a;
            color: #0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid #0f0;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        .logo {
            font-size: 60px;
            text-align: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px #0f0);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        input {
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            color: #0f0;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 16px;
            color: #0f0;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 30px #0f0;
        }
        
        .info-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0f0;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .question-header {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
        }
        
        .question-text {
            font-size: 1.5rem;
            margin: 30px 0;
            text-align: center;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }
        
        .option {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .option:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px #0f0;
        }
        
        .option.selected {
            background: rgba(0, 255, 0, 0.2);
        }
        
        .option-letter {
            width: 40px;
            height: 40px;
            background: #0f0;
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        
        .status {
            text-align: center;
            padding: 20px;
            border-radius: 16px;
        }
        
        .status.correct { 
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
            color: #0f0;
        }
        
        .status.wrong { 
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .status.waiting {
            background: rgba(255, 255, 0, 0.1);
            border: 1px solid yellow;
            color: yellow;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 0, 0.3);
            border-top: 3px solid #0f0;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="joinScreen" class="screen active">
            <div class="logo">🛡️</div>
            <h1>КИБЕР КАХУТ</h1>
            <div id="errorContainer"></div>
            <input type="text" id="playerName" placeholder="Твоё имя">
            <input type="text" id="gameCode" placeholder="Код игры">
            <button id="joinButton" class="btn">🔌 ПОДКЛЮЧИТЬСЯ</button>
        </div>

        <div id="waitingScreen" class="screen">
            <div class="logo">⏳</div>
            <h2>ОЖИДАНИЕ...</h2>
            <div class="loader"></div>
            <div class="info-box">
                <div class="info-item">
                    <span>Участник:</span>
                    <strong id="displayName">-</strong>
                </div>
                <div class="info-item">
                    <span>Код:</span>
                    <strong id="displayCode">-</strong>
                </div>
                <div class="info-item">
                    <span>Очки:</span>
                    <strong id="displayScore">0</strong>
                </div>
            </div>
            <button onclick="leaveGame()" class="btn">🚪 ВЫЙТИ</button>
        </div>

        <div id="questionScreen" class="screen">
            <div class="question-header">
                <span>КИБЕРБЕЗОПАСНОСТЬ</span>
                <span id="questionCounter">1/5</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="status waiting" id="answerStatus">⏳ Выбери ответ</div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 1, points: 1 },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2, points: 1 },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1, points: 1 },
            { id: 4, text: "Что такое VPN?", options: ["Вирус", "Частная сеть", "Пароль", "Антивирус"], correct: 1, points: 1 },
            { id: 5, text: "Что такое бэкап?", options: ["Копия", "Удаление", "Вирус", "Игра"], correct: 0, points: 1 }
        ];

        let gameCode = null;
        let playerName = null;
        let currentQuestion = null;
        let hasAnswered = false;
        let pollInterval = null;
        let playerScore = 0;
        let currentQuestionId = null;

        const joinButton = document.getElementById('joinButton');
        const errorContainer = document.getElementById('errorContainer');
        const playerNameInput = document.getElementById('playerName');
        const gameCodeInput = document.getElementById('gameCode');

        function showError(msg) {
            errorContainer.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => errorContainer.innerHTML = '', 3000);
        }

        function switchScreen(screen) {
            ['join', 'waiting', 'question'].forEach(s => {
                document.getElementById(s + 'Screen').classList.remove('active');
            });
            document.getElementById(screen + 'Screen').classList.add('active');
        }

        joinButton.addEventListener('click', async () => {
            const name = playerNameInput.value.trim();
            const code = gameCodeInput.value.trim();
            
            if (!name || !code) {
                showError("Введите имя и код");
                return;
            }
            
            try {
                const { error } = await SB
                    .from('players')
                    .insert({
                        game_code: code,
                        name: name,
                        score: 0,
                        answered: false,
                        joined_at: Date.now()
                    });
                
                if (error) throw error;
                
                gameCode = code;
                playerName = name;
                
                document.getElementById('displayName').innerText = name;
                document.getElementById('displayCode').innerText = code;
                switchScreen('waiting');
                
                // Проверяем статус игры каждые 2 секунды
                pollInterval = setInterval(checkGameStatus, 2000);
                
            } catch (e) {
                showError(e.message);
            }
        });

        async function checkGameStatus() {
            if (!gameCode) return;
            
            try {
                const { data, error } = await SB
                    .from('games')
                    .select('status, current_question')
                    .eq('code', gameCode)
                    .maybeSingle();
                
                if (error) {
                    console.error('Ошибка при проверке игры:', error);
                    return;
                }
                
                if (data && data.status === 'active' && data.current_question && data.current_question !== currentQuestionId) {
                    // Нашли новый активный вопрос - показываем его
                    currentQuestionId = data.current_question;
                    hasAnswered = false;
                    clearInterval(pollInterval);
                    loadQuestion(data.current_question);
                }
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }

        function loadQuestion(questionId) {
            const question = QUESTIONS.find(q => q.id === questionId);
            if (!question) return;
            
            currentQuestion = question;
            switchScreen('question');
            
            document.getElementById('questionText').innerText = question.text;
            document.getElementById('questionCounter').innerText = `${questionId}/5`;
            
            const optionsHtml = question.options.map((opt, i) => `
                <div class="option" onclick="selectAnswer(${i})">
                    <div class="option-letter">${String.fromCharCode(65 + i)}</div>
                    <div>${opt}</div>
                </div>
            `).join('');
            document.getElementById('optionsContainer').innerHTML = optionsHtml;
            document.getElementById('answerStatus').innerHTML = '⏳ Выбери ответ';
            document.getElementById('answerStatus').className = 'status waiting';
        }

        window.selectAnswer = async (index) => {
            if (hasAnswered || !currentQuestion || !gameCode || !playerName) return;
            
            hasAnswered = true;
            
            // Подсвечиваем выбранный вариант
            document.querySelectorAll('.option').forEach((opt, i) => {
                if (i === index) opt.classList.add('selected');
            });
            
            const isCorrect = (index === currentQuestion.correct);
            
            const statusDiv = document.getElementById('answerStatus');
            statusDiv.textContent = isCorrect ? "✅ ПРАВИЛЬНО!" : "❌ НЕПРАВИЛЬНО";
            statusDiv.className = isCorrect ? "status correct" : "status wrong";
            
            try {
                // Сохраняем ответ
                const { error: answerError } = await SB
                    .from('answers')
                    .insert({
                        game_code: gameCode,
                        question_id: currentQuestion.id,
                        player_name: playerName,
                        answer_index: index,
                        is_correct: isCorrect,
                        answered_at: Date.now()
                    });
                
                if (answerError) throw answerError;
                
                if (isCorrect) {
                    playerScore += currentQuestion.points;
                    document.getElementById('displayScore').innerText = playerScore;
                    
                    // Обновляем счёт игрока
                    await SB
                        .from('players')
                        .update({ 
                            score: playerScore, 
                            answered: true 
                        })
                        .eq('game_code', gameCode)
                        .eq('name', playerName);
                } else {
                    // Отмечаем что игрок ответил
                    await SB
                        .from('players')
                        .update({ answered: true })
                        .eq('game_code', gameCode)
                        .eq('name', playerName);
                }
                
            } catch (e) {
                console.error('Ошибка сохранения ответа:', e);
                hasAnswered = false;
            }
        };

        window.leaveGame = () => {
            if (pollInterval) clearInterval(pollInterval);
            gameCode = null;
            playerName = null;
            currentQuestion = null;
            hasAnswered = false;
            currentQuestionId = null;
            playerScore = 0;
            switchScreen('join');
            playerNameInput.value = '';
            gameCodeInput.value = '';
            document.getElementById('displayScore').innerText = '0';
        };
    </script>
</body>
</html>
