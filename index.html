<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Кахут</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            border: 2px solid #0f0;
            padding: 50px;
            border-radius: 20px;
            background: #111;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 20px;
        }
        a {
            display: block;
            padding: 20px 40px;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
        }
        a:hover {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ КИБЕР КАХУТ</h1>
        <div class="buttons">
            <a href="teacher.html">👨‍🏫 УЧИТЕЛЬ</a>
            <a href="student.html">🧑‍🎓 УЧЕНИК</a>
        </div>
    </div>
</body>
</html>
