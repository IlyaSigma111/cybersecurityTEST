<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учитель - Кибер Кахут</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0a;
            color: #0f0;
            min-height: 100vh;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }
        
        #mainInterface {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        .teacher-header {
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f0;
            flex-shrink: 0;
        }
        
        .header-left h1 {
            font-size: 1.5rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .game-code-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid #0f0;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .code-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #0f0;
            letter-spacing: 2px;
            min-width: 150px;
            text-align: center;
        }
        
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            border: 2px solid #0f0;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(0,255,0,0.1);
            color: #0f0;
            transition: all 0.3s;
        }
        
        .glass-btn:hover {
            background: rgba(0,255,0,0.2);
            box-shadow: 0 0 20px #0f0;
            transform: translateY(-2px);
        }
        
        .glass-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        
        .left-column, .right-column {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #0f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .glass-panel h2 {
            color: #0f0;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        
        .control-buttons .glass-btn {
            padding: 15px;
            font-size: 1rem;
            justify-content: flex-start;
        }
        
        .info-block {
            background: rgba(0,0,0,0.3);
            border: 1px solid #0f0;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .info-value {
            color: #0f0;
            font-weight: 700;
            font-size: 1.2rem;
        }
        
        .players-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .players-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        
        .player-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }
        
        .player-avatar {
            width: 50px;
            height: 50px;
            background: #0f0;
            color: black;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
        }
        
        .questions-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .question-item {
            background: rgba(0,0,0,0.3);
            border: 2px solid #0f0;
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
        }
        
        .question-item:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
        }
        
        .question-item.active {
            border-color: #ff00ff;
            background: rgba(255,0,255,0.1);
        }
        
        .question-number {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .question-difficulty {
            font-size: 0.7rem;
            margin-bottom: 5px;
        }
        
        .question-status {
            font-size: 1.2rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(0,255,0,0.5);
        }
        
        .hidden { display: none; }
        
        #presentationMode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        #presentationMode.active {
            display: flex;
        }
        
        .presentation-header {
            background: rgba(0,255,0,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #0f0;
        }
        
        .presentation-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .presentation-question {
            max-width: 800px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #0f0;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
        }
        
        .presentation-question h2 {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        
        .presentation-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }
        
        .presentation-option {
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 20px;
        }
        
        .presentation-option.correct {
            border-color: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>
    <div id="mainInterface">
        <header class="teacher-header">
            <div class="header-left">
                <h1>👨‍🏫 ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ</h1>
            </div>
            <div class="game-code-box">
                <span>КОД:</span>
                <div id="gameCode" class="code-display">----</div>
                <a href="index.html" class="glass-btn">
                    <i class="fas fa-home"></i> Главная
                </a>
            </div>
        </header>

        <div class="main-content">
            <div class="left-column">
                <div class="glass-panel">
                    <h2><i class="fas fa-gamepad"></i> УПРАВЛЕНИЕ</h2>
                    
                    <div id="startSection">
                        <button onclick="createGame()" class="glass-btn control-buttons">
                            <i class="fas fa-plus-circle"></i> СОЗДАТЬ ИГРУ
                        </button>
                    </div>

                    <div id="gameControls" class="hidden">
                        <div class="control-buttons">
                            <button onclick="showQuestionOnBoard(0)" id="showFirstBtn" class="glass-btn">
                                <i class="fas fa-play"></i> ПОКАЗАТЬ ВОПРОС 1
                            </button>
                            <button onclick="showAnswerOnBoard()" id="showAnswerBtn" class="glass-btn" disabled>
                                <i class="fas fa-check-circle"></i> ПОКАЗАТЬ ОТВЕТ
                            </button>
                            <button onclick="nextQuestion()" id="nextBtn" class="glass-btn" disabled>
                                <i class="fas fa-forward"></i> СЛЕДУЮЩИЙ
                            </button>
                            <button onclick="resetGame()" class="glass-btn">
                                <i class="fas fa-redo"></i> СБРОСИТЬ
                            </button>
                        </div>
                        
                        <div class="info-block">
                            <div class="info-row">
                                <span>Текущий вопрос:</span>
                                <span class="info-value" id="currentQ">0/5</span>
                            </div>
                            <div class="info-row">
                                <span>Игроков:</span>
                                <span class="info-value" id="playerCount">0</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="glass-panel" style="flex:1;">
                    <h2><i class="fas fa-users"></i> УЧАСТНИКИ</h2>
                    <div class="players-container">
                        <div id="playersList" class="players-list">
                            <div class="empty-state">
                                <div class="empty-icon">👤</div>
                                <p>Ожидание игроков...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="glass-panel">
                    <h2><i class="fas fa-list-ol"></i> ВОПРОСЫ</h2>
                    <div class="questions-container">
                        <div id="questionsList" class="questions-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="presentationMode">
        <div class="presentation-header">
            <span>🎯 ВОПРОС <span id="presQNum">1</span>/5</span>
            <span>Ответили: <span id="presAnswered">0</span> | Правильно: <span id="presCorrect">0</span></span>
        </div>
        <div class="presentation-content">
            <div class="presentation-question">
                <h2 id="presQuestionText"></h2>
                <div class="presentation-options" id="presOptions"></div>
            </div>
        </div>
        <div style="padding:20px; text-align:center; border-top:1px solid #0f0;">
            <button class="glass-btn" onclick="closePresentation()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 1, difficulty: "easy" },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2, difficulty: "easy" },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1, difficulty: "easy" },
            { id: 4, text: "Что такое VPN?", options: ["Вирус", "Частная сеть", "Пароль", "Антивирус"], correct: 1, difficulty: "easy" },
            { id: 5, text: "Что такое бэкап?", options: ["Копия", "Удаление", "Вирус", "Игра"], correct: 0, difficulty: "easy" }
        ];

        let gameCode = null;
        let currentQuestionIndex = 0;
        let pollInterval = null;

        async function createGame() {
            try {
                const code = Math.floor(10000000 + Math.random() * 90000000).toString();
                
                const { error } = await SB
                    .from('games')
                    .insert({ 
                        code: code, 
                        created_at: Date.now(), 
                        status: 'waiting'
                    });
                
                if (error) throw error;
                
                gameCode = code;
                
                document.getElementById('startSection').style.display = 'none';
                document.getElementById('gameControls').classList.remove('hidden');
                document.getElementById('gameCode').innerText = code;
                document.getElementById('currentQ').innerText = '0/5';
                
                renderQuestions();
                startPolling();
                
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        function renderQuestions() {
            const list = document.getElementById('questionsList');
            list.innerHTML = QUESTIONS.map((q, i) => {
                let difficultyColor = q.difficulty === 'easy' ? '#0f0' : q.difficulty === 'medium' ? 'yellow' : 'red';
                let difficultyText = q.difficulty.toUpperCase();
                let status = i === currentQuestionIndex ? '🔴' : i < currentQuestionIndex ? '✅' : '⏳';
                
                return `
                    <div class="question-item ${i === currentQuestionIndex ? 'active' : ''}" 
                         onclick="showQuestionOnBoard(${i})">
                        <div class="question-number">${i+1}</div>
                        <div class="question-difficulty" style="color: ${difficultyColor}">${difficultyText}</div>
                        <div class="question-status">${status}</div>
                    </div>
                `;
            }).join('');
        }

        async function showQuestionOnBoard(index) {
            currentQuestionIndex = index;
            renderQuestions();
            
            const q = QUESTIONS[index];
            
            // Обновляем в базе данных текущий вопрос
            await SB
                .from('games')
                .update({ 
                    status: 'active', 
                    current_question: q.id 
                })
                .eq('code', gameCode);
            
            document.getElementById('presQNum').innerText = index + 1;
            document.getElementById('presQuestionText').innerText = q.text;
            
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `<div class="presentation-option">${opt}</div>`;
            });
            document.getElementById('presOptions').innerHTML = optionsHtml;
            
            document.getElementById('presentationMode').classList.add('active');
            document.getElementById('showAnswerBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
        }

        function showAnswerOnBoard() {
            const q = QUESTIONS[currentQuestionIndex];
            const options = document.querySelectorAll('.presentation-option');
            
            options.forEach((opt, i) => {
                if (i === q.correct) {
                    opt.classList.add('correct');
                }
            });
            
            document.getElementById('showAnswerBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestionIndex + 1 < QUESTIONS.length) {
                showQuestionOnBoard(currentQuestionIndex + 1);
            } else {
                alert('🎉 Все вопросы пройдены!');
                closePresentation();
            }
        }

        function closePresentation() {
            document.getElementById('presentationMode').classList.remove('active');
        }

        async function updatePlayers() {
            if (!gameCode) return;
            
            const { data, error } = await SB
                .from('players')
                .select('*')
                .eq('game_code', gameCode);
            
            if (error) return;
            
            document.getElementById('playerCount').innerText = data.length;
            
            const list = document.getElementById('playersList');
            if (data.length === 0) {
                list.innerHTML = '<div class="empty-state">👤 Ожидание игроков...</div>';
            } else {
                list.innerHTML = data.map(p => `
                    <div class="player-card">
                        <div class="player-avatar">${p.name[0]}</div>
                        <div class="player-name">${p.name}</div>
                        <div>🎯 ${p.score || 0}</div>
                    </div>
                `).join('');
            }
        }

        function startPolling() {
            updatePlayers();
            pollInterval = setInterval(updatePlayers, 2000);
        }

        function resetGame() {
            if (pollInterval) clearInterval(pollInterval);
            gameCode = null;
            currentQuestionIndex = 0;
            document.getElementById('startSection').style.display = 'block';
            document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('gameCode').innerText = '----';
            document.getElementById('playersList').innerHTML = '<div class="empty-state">👤 Ожидание игроков...</div>';
            renderQuestions();
            closePresentation();
        }
    </script>
</body>
</html>
