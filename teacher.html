<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учитель - Кибер Кахут</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #0f0;
        }
        .panel {
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .code-box {
            background: #000;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .code {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 5px;
        }
        .players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .player {
            background: #000;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 ПАНЕЛЬ УЧИТЕЛЯ</h1>
        
        <div class="panel">
            <button onclick="createGame()" id="createBtn">🎮 СОЗДАТЬ ИГРУ</button>
            
            <div id="gamePanel" class="hidden">
                <div class="code-box">
                    <div>КОД ИГРЫ</div>
                    <div class="code" id="gameCode">----</div>
                </div>
                
                <h2>ИГРОКИ (<span id="playerCount">0</span>)</h2>
                <div class="players" id="playersList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentGameCode = null;
        let interval = null;

        window.createGame = async function() {
            try {
                const code = Math.floor(10000000 + Math.random() * 90000000).toString();
                
                const { error } = await APP_SUPABASE
                    .from('games')
                    .insert({ 
                        code: code, 
                        created_at: Date.now(), 
                        status: 'waiting'
                    });
                
                if (error) throw error;
                
                currentGameCode = code;
                
                document.getElementById('createBtn').style.display = 'none';
                document.getElementById('gamePanel').classList.remove('hidden');
                document.getElementById('gameCode').innerText = code;
                
                updatePlayers();
                if (interval) clearInterval(interval);
                interval = setInterval(updatePlayers, 2000);
                
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        };

        async function updatePlayers() {
            if (!currentGameCode) return;
            
            try {
                const { data, error } = await APP_SUPABASE
                    .from('players')
                    .select('*')
                    .eq('game_code', currentGameCode);
                
                if (error) throw error;
                
                document.getElementById('playerCount').innerText = data.length;
                
                const list = document.getElementById('playersList');
                if (data.length === 0) {
                    list.innerHTML = '<div style="text-align:center;">👤 Ожидание игроков...</div>';
                } else {
                    list.innerHTML = data.map(p => `
                        <div class="player">
                            <div>👤 ${p.name}</div>
                            <div>🎯 ${p.score || 0}</div>
                        </div>
                    `).join('');
                }
                
            } catch (e) {
                console.error('Ошибка обновления:', e);
            }
        }
    </script>
</body>
</html>
