<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учитель - Кибер Кахут</title>
    <!-- ═══════════════════════════════════════════════════════════════════════
         ПОДКЛЮЧЕНИЕ БИБЛИОТЕК
         - font-awesome: иконки
         - google fonts: шрифты
         - supabase: работа с базой данных
         - config.js: наши настройки
         ═══════════════════════════════════════════════════════════════════════ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         СТИЛИ - оформление панели учителя
         Здесь можно менять цвета, размеры, анимации
         ═══════════════════════════════════════════════════════════════════════ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0a0a;
            color: #0f0;
            min-height: 100vh;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }
        
        #mainInterface {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        .teacher-header {
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f0;
            flex-shrink: 0;
        }
        
        .header-left h1 {
            font-size: 1.5rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .game-code-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid #0f0;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .code-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #0f0;
            letter-spacing: 2px;
            min-width: 150px;
            text-align: center;
        }
        
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            border: 2px solid #0f0;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(0,255,0,0.1);
            color: #0f0;
            transition: all 0.3s;
        }
        
        .glass-btn:hover {
            background: rgba(0,255,0,0.2);
            box-shadow: 0 0 20px #0f0;
            transform: translateY(-2px);
        }
        
        .glass-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        
        .left-column, .right-column {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #0f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .glass-panel h2 {
            color: #0f0;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        
        .control-buttons .glass-btn {
            padding: 15px;
            font-size: 1rem;
            justify-content: flex-start;
        }
        
        .info-block {
            background: rgba(0,0,0,0.3);
            border: 1px solid #0f0;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .info-value {
            color: #0f0;
            font-weight: 700;
            font-size: 1.2rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        
        .stat-card {
            background: rgba(0,0,0,0.5);
            border: 1px solid #0f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .players-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .players-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        
        .player-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }
        
        .player-card.answered {
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
        }
        
        .player-avatar {
            width: 50px;
            height: 50px;
            background: #0f0;
            color: black;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
        }
        
        .questions-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .question-item {
            background: rgba(0,0,0,0.3);
            border: 2px solid #0f0;
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
        }
        
        .question-item:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
        }
        
        .question-item.active {
            border-color: #ff00ff;
            background: rgba(255,0,255,0.1);
        }
        
        .question-number {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .question-difficulty {
            font-size: 0.7rem;
            margin-bottom: 5px;
        }
        
        .question-status {
            font-size: 1.2rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(0,255,0,0.5);
        }
        
        .hidden { display: none; }
        
        /* ═══════════════════════════════════════════════════════════════════
           СТИЛИ ДЛЯ РЕЖИМА ПРЕЗЕНТАЦИИ
           - Крупный вопрос на весь экран
           - Статистика ответов в шапке
           - Без вариантов ответа (только вопрос)
           ═══════════════════════════════════════════════════════════════════ */
        #presentationMode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        #presentationMode.active {
            display: flex;
        }
        
        .presentation-header {
            background: rgba(0,255,0,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #0f0;
            font-size: 1.2rem;
        }
        
        .presentation-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .presentation-question {
            max-width: 900px;
            width: 100%;
            background: rgba(0,0,0,0.7);
            border: 2px solid #0f0;
            border-radius: 30px;
            padding: 60px;
            text-align: center;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           УВЕЛИЧЕННЫЙ ВОПРОС - вариант с большим шрифтом
           Варианты ответов скрыты, так как их видят только ученики
           ═══════════════════════════════════════════════════════════════════ */
        .presentation-question h2 {
            font-size: 4rem;  /* Увеличенный размер вопроса */
            line-height: 1.4;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #0f0;
        }
        
        .stats-box {
            display: inline-block;
            background: rgba(0,0,0,0.5);
            border: 2px solid #0f0;
            border-radius: 20px;
            padding: 20px 40px;
            margin-top: 30px;
            font-size: 2rem;
        }
        
        .stats-box span {
            color: #ff00ff;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 15px;
        }
        
        .presentation-controls {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="mainInterface">
        <header class="teacher-header">
            <div class="header-left">
                <h1>👨‍🏫 ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ</h1>
            </div>
            <div class="game-code-box">
                <span>КОД:</span>
                <div id="gameCode" class="code-display">----</div>
                <a href="index.html" class="glass-btn">
                    <i class="fas fa-home"></i> Главная
                </a>
            </div>
        </header>

        <div class="main-content">
            <div class="left-column">
                <div class="glass-panel">
                    <h2><i class="fas fa-gamepad"></i> УПРАВЛЕНИЕ</h2>
                    
                    <div id="startSection">
                        <button onclick="createGame()" class="glass-btn control-buttons">
                            <i class="fas fa-plus-circle"></i> СОЗДАТЬ ИГРУ
                        </button>
                    </div>

                    <div id="gameControls" class="hidden">
                        <div class="control-buttons">
                            <button onclick="showQuestionOnBoard(0)" id="showFirstBtn" class="glass-btn">
                                <i class="fas fa-play"></i> ПОКАЗАТЬ ВОПРОС 1
                            </button>
                            <button onclick="showAnswerOnBoard()" id="showAnswerBtn" class="glass-btn" disabled>
                                <i class="fas fa-check-circle"></i> ПОКАЗАТЬ ОТВЕТ
                            </button>
                            <button onclick="nextQuestion()" id="nextBtn" class="glass-btn" disabled>
                                <i class="fas fa-forward"></i> СЛЕДУЮЩИЙ
                            </button>
                            <button onclick="finishGame()" class="glass-btn">
                                <i class="fas fa-flag-checkered"></i> ЗАВЕРШИТЬ ИГРУ
                            </button>
                            <button onclick="resetGame()" class="glass-btn">
                                <i class="fas fa-redo"></i> СБРОСИТЬ
                            </button>
                        </div>
                        
                        <!-- ══════════════════════════════════════════════════════════
                             СТАТИСТИКА ОТВЕТОВ - крупные цифры
                             Отображает сколько игроков ответило и сколько правильно
                             ══════════════════════════════════════════════════════════ -->
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value" id="totalPlayers">0</div>
                                <div>Игроков</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="answeredCount">0</div>
                                <div>Ответили</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="correctCount">0</div>
                                <div>Правильно</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="wrongCount">0</div>
                                <div>Неправильно</div>
                            </div>
                        </div>
                        
                        <div class="info-block">
                            <div class="info-row">
                                <span>Текущий вопрос:</span>
                                <span class="info-value" id="currentQ">0/5</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="glass-panel" style="flex:1;">
                    <h2><i class="fas fa-users"></i> УЧАСТНИКИ</h2>
                    <div class="players-container">
                        <div id="playersList" class="players-list">
                            <div class="empty-state">
                                <div class="empty-icon">👤</div>
                                <p>Ожидание игроков...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="glass-panel">
                    <h2><i class="fas fa-list-ol"></i> ВОПРОСЫ</h2>
                    <div class="questions-container">
                        <div id="questionsList" class="questions-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         РЕЖИМ ПРЕЗЕНТАЦИИ - показывается на весь экран
         Здесь только крупный вопрос и статистика, без вариантов ответа
         ═══════════════════════════════════════════════════════════════════════ -->
    <div id="presentationMode">
        <div class="presentation-header">
            <span>🎯 ВОПРОС <span id="presQNum">1</span>/5</span>
            <span>Ответили: <span id="presAnswered">0</span> | Правильно: <span id="presCorrect">0</span></span>
        </div>
        <div class="presentation-content">
            <div class="presentation-question">
                <h2 id="presQuestionText"></h2>
                <!-- Варианты ответов НЕ показываются - они только у учеников -->
                <div class="stats-box">
                    <span id="presAnsweredBig">0</span> из <span id="presTotalBig">0</span> ответили<br>
                    <span style="color: #ff00ff;" id="presCorrectBig">0</span> правильно
                </div>
            </div>
        </div>
        <div class="presentation-controls">
            <button class="glass-btn" onclick="closePresentation()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         СКРИПТ - вся логика работы учителя
         Здесь происходит:
         - Создание игры с уникальным кодом
         - Отслеживание подключившихся игроков
         - Показ вопросов на доске
         - Сбор статистики ответов
         - Завершение игры и показ результатов
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // МАССИВ ВОПРОСОВ - ЗДЕСЬ МЕНЯТЬ ВОПРОСЫ ДЛЯ НОВОЙ ВИКТОРИНЫ
        // ═══════════════════════════════════════════════════════════════════════
        // Структура вопроса:
        // id: уникальный номер вопроса
        // text: текст вопроса
        // options: массив вариантов ответа (4 штуки)
        // correct: индекс правильного ответа (0,1,2,3)
        // points: количество очков за правильный ответ
        // difficulty: сложность (easy, medium, hard) - влияет на цвет в списке
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 1, points: 1, difficulty: "easy" },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2, points: 1, difficulty: "easy" },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1, points: 1, difficulty: "easy" },
            { id: 4, text: "Что такое VPN?", options: ["Вирус", "Частная сеть", "Пароль", "Антивирус"], correct: 1, points: 1, difficulty: "easy" },
            { id: 5, text: "Что такое бэкап?", options: ["Копия", "Удаление", "Вирус", "Игра"], correct: 0, points: 1, difficulty: "easy" }
        ];

        // ═══════════════════════════════════════════════════════════════════════
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ═══════════════════════════════════════════════════════════════════════
        let gameCode = null;              // Код текущей игры (8 цифр)
        let currentQuestionIndex = 0;     // Индекс текущего вопроса (0-4)
        let pollInterval = null;          // Интервал для обновления списка игроков
        let statsInterval = null;         // Интервал для обновления статистики

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: createGame() - создание новой игры
        // Действия:
        // 1. Генерирует случайный 8-значный код
        // 2. Сохраняет игру в таблицу games с полем quiz_id = QUIZ_ID из config.js
        // 3. Показывает панель управления
        // 4. Запускает обновление списка игроков и статистики
        // ═══════════════════════════════════════════════════════════════════════
        async function createGame() {
            try {
                const code = Math.floor(10000000 + Math.random() * 90000000).toString();
                
                const { error } = await SB
                    .from('games')
                    .insert({ 
                        code: code, 
                        quiz_id: QUIZ_ID,           // ← ВАЖНО: добавляем ID викторины
                        created_at: Date.now(), 
                        status: 'waiting',
                        current_question: 0
                    });
                
                if (error) throw error;
                
                gameCode = code;
                
                document.getElementById('startSection').style.display = 'none';
                document.getElementById('gameControls').classList.remove('hidden');
                document.getElementById('gameCode').innerText = code;
                document.getElementById('currentQ').innerText = '0/' + QUESTIONS.length;
                
                renderQuestions();
                startPolling();
                startStatsPolling();
                
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: renderQuestions() - отрисовка списка вопросов
        // Каждый вопрос показывается как плитка с номером и статусом
        // Статусы: 🔴 - текущий, ✅ - пройден, ⏳ - предстоит
        // ═══════════════════════════════════════════════════════════════════════
        function renderQuestions() {
            const list = document.getElementById('questionsList');
            list.innerHTML = QUESTIONS.map((q, i) => {
                let difficultyColor = q.difficulty === 'easy' ? '#0f0' : q.difficulty === 'medium' ? 'yellow' : 'red';
                let difficultyText = q.difficulty.toUpperCase();
                let status = i === currentQuestionIndex ? '🔴' : i < currentQuestionIndex ? '✅' : '⏳';
                
                return `
                    <div class="question-item ${i === currentQuestionIndex ? 'active' : ''}" 
                         onclick="showQuestionOnBoard(${i})">
                        <div class="question-number">${i+1}</div>
                        <div class="question-difficulty" style="color: ${difficultyColor}">${difficultyText}</div>
                        <div class="question-status">${status}</div>
                    </div>
                `;
            }).join('');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: showQuestionOnBoard(index) - показ вопроса на доске
        // Действия:
        // 1. Обновляет текущий вопрос в базе данных
        // 2. Показывает крупный вопрос в режиме презентации
        // 3. Обновляет статистику
        // ═══════════════════════════════════════════════════════════════════════
        async function showQuestionOnBoard(index) {
            currentQuestionIndex = index;
            renderQuestions();
            
            const q = QUESTIONS[index];
            
            // Обновляем в базе данных текущий вопрос
            await SB
                .from('games')
                .update({ 
                    status: 'active', 
                    current_question: q.id 
                })
                .eq('code', gameCode);
            
            // Обновляем интерфейс презентации
            document.getElementById('presQNum').innerText = index + 1;
            document.getElementById('presQuestionText').innerText = q.text;
            
            document.getElementById('presentationMode').classList.add('active');
            document.getElementById('showAnswerBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
            
            // Обновляем статистику сразу
            await updateStats();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: showAnswerOnBoard() - показ правильного ответа
        // В режиме презентации подсвечивает правильный ответ
        // ═══════════════════════════════════════════════════════════════════════
        function showAnswerOnBoard() {
            const q = QUESTIONS[currentQuestionIndex];
            // Визуально отмечаем правильный ответ (можно добавить подсветку)
            document.getElementById('showAnswerBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
            
            // Можно добавить анимацию или звук
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: nextQuestion() - переход к следующему вопросу
        // ═══════════════════════════════════════════════════════════════════════
        function nextQuestion() {
            if (currentQuestionIndex + 1 < QUESTIONS.length) {
                showQuestionOnBoard(currentQuestionIndex + 1);
            } else {
                alert('🎉 Все вопросы пройдены!');
                closePresentation();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: finishGame() - завершение игры
        // Меняет статус игры на 'finished', чтобы ученики увидели результаты
        // ═══════════════════════════════════════════════════════════════════════
        async function finishGame() {
            if (!gameCode) return;
            
            await SB
                .from('games')
                .update({ status: 'finished' })
                .eq('code', gameCode);
            
            alert('✅ Игра завершена! Ученики увидят результаты.');
            resetGame();
        }

        function closePresentation() {
            document.getElementById('presentationMode').classList.remove('active');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: updatePlayers() - обновление списка игроков
        // Запрашивает из базы всех игроков текущей игры
        // Фильтрует по quiz_id и game_code
        // ═══════════════════════════════════════════════════════════════════════
        async function updatePlayers() {
            if (!gameCode) return;
            
            try {
                const { data, error } = await SB
                    .from('players')
                    .select('*')
                    .eq('game_code', gameCode);
                
                if (error) throw error;
                
                document.getElementById('totalPlayers').innerText = data.length;
                
                const list = document.getElementById('playersList');
                if (data.length === 0) {
                    list.innerHTML = '<div class="empty-state">👤 Ожидание игроков...</div>';
                } else {
                    list.innerHTML = data.map(p => `
                        <div class="player-card ${p.answered ? 'answered' : ''}">
                            <div class="player-avatar">${p.name[0]}</div>
                            <div class="player-name">${p.name}</div>
                            <div>🎯 ${p.score || 0}</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error('Ошибка обновления игроков:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: updateStats() - обновление статистики ответов
        // Считает сколько игроков ответило на текущий вопрос
        // и сколько из них правильно
        // ═══════════════════════════════════════════════════════════════════════
        async function updateStats() {
            if (!gameCode || currentQuestionIndex < 0) return;
            
            try {
                const currentQuestionId = QUESTIONS[currentQuestionIndex].id;
                
                // Получаем ответы на текущий вопрос
                const { data: answers, error } = await SB
                    .from('answers')
                    .select('*')
                    .eq('game_code', gameCode)
                    .eq('question_id', currentQuestionId);
                
                if (error) throw error;
                
                const answeredCount = answers?.length || 0;
                const correctCount = answers?.filter(a => a.is_correct).length || 0;
                const wrongCount = answeredCount - correctCount;
                
                // Получаем общее количество игроков
                const { data: players } = await SB
                    .from('players')
                    .select('*')
                    .eq('game_code', gameCode);
                
                const totalPlayers = players?.length || 0;
                
                // Обновляем общую статистику
                document.getElementById('answeredCount').innerText = answeredCount;
                document.getElementById('correctCount').innerText = correctCount;
                document.getElementById('wrongCount').innerText = wrongCount;
                
                // Обновляем статистику в презентации (крупные цифры)
                if (document.getElementById('presentationMode').classList.contains('active')) {
                    document.getElementById('presAnswered').innerText = answeredCount;
                    document.getElementById('presCorrect').innerText = correctCount;
                    document.getElementById('presAnsweredBig').innerText = answeredCount;
                    document.getElementById('presCorrectBig').innerText = correctCount;
                    document.getElementById('presTotalBig').innerText = totalPlayers;
                }
            } catch (e) {
                console.error('Ошибка обновления статистики:', e);
            }
        }

        function startPolling() {
            updatePlayers();
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(updatePlayers, 2000);
        }

        function startStatsPolling() {
            updateStats();
            if (statsInterval) clearInterval(statsInterval);
            statsInterval = setInterval(updateStats, 2000);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // ФУНКЦИЯ: resetGame() - сброс игры
        // Возвращает интерфейс в начальное состояние
        // ═══════════════════════════════════════════════════════════════════════
        function resetGame() {
            if (pollInterval) clearInterval(pollInterval);
            if (statsInterval) clearInterval(statsInterval);
            gameCode = null;
            currentQuestionIndex = 0;
            document.getElementById('startSection').style.display = 'block';
            document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('gameCode').innerText = '----';
            document.getElementById('playersList').innerHTML = '<div class="empty-state">👤 Ожидание игроков...</div>';
            document.getElementById('answeredCount').innerText = '0';
            document.getElementById('correctCount').innerText = '0';
            document.getElementById('wrongCount').innerText = '0';
            renderQuestions();
            closePresentation();
        }
    </script>
</body>
</html>
