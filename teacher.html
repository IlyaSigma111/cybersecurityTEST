<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учитель - Кибер Кахут</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; }
        .panel {
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .code-box {
            background: #000;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            margin: 20px 0;
        }
        .players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .player {
            background: #000;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .hidden { display: none; }
        .question-item {
            border: 1px solid #0f0;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
        .active { border-color: #ff00ff; background: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 УЧИТЕЛЬ</h1>
        
        <div class="panel">
            <button onclick="createGame()" id="createBtn">🎮 СОЗДАТЬ ИГРУ</button>
            
            <div id="gamePanel" class="hidden">
                <div class="code-box" id="gameCode">----</div>
                
                <button onclick="activateGame()" id="activateBtn">▶ АКТИВИРОВАТЬ ИГРУ</button>
                
                <h3>ВОПРОСЫ:</h3>
                <div id="questionsList"></div>
                
                <h3>ИГРОКИ (<span id="playerCount">0</span>)</h3>
                <div class="players" id="playersList"></div>
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { id: 1, text: "Что такое фишинг?", options: ["Вид рыбалки", "Кража данных", "Антивирус", "Шифрование"], correct: 1 },
            { id: 2, text: "Какой пароль самый ненадежный?", options: ["G7$k2!mN9", "Tr0ub4dor&3", "qwerty123", "P@ssw0rd!$"], correct: 2 },
            { id: 3, text: "Что такое 2FA?", options: ["2 аккаунта", "2 фактора", "2 файла", "2 вируса"], correct: 1 },
            { id: 4, text: "Что такое VPN?", options: ["Вирус", "Частная сеть", "Пароль", "Антивирус"], correct: 1 },
            { id: 5, text: "Что такое бэкап?", options: ["Копия", "Удаление", "Вирус", "Игра"], correct: 0 }
        ];

        let gameId = null;
        let gameCode = null;
        let interval = null;
        let currentQuestion = 0;

        async function createGame() {
            try {
                const code = Math.floor(10000000 + Math.random() * 90000000).toString();
                
                const { data, error } = await APP_SUPABASE
                    .from('games')
                    .insert({ 
                        code: code, 
                        created_at: Date.now(), 
                        status: 'waiting'
                    })
                    .select();
                
                if (error) throw error;
                
                gameId = data[0].id;
                gameCode = code;
                
                document.getElementById('createBtn').style.display = 'none';
                document.getElementById('gamePanel').classList.remove('hidden');
                document.getElementById('gameCode').innerText = code;
                
                renderQuestions();
                updatePlayers();
                interval = setInterval(updatePlayers, 2000);
                
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        async function activateGame() {
            try {
                const { error } = await APP_SUPABASE
                    .from('games')
                    .update({ status: 'active', current_question: 1 })
                    .eq('id', gameId);
                
                if (error) throw error;
                
                document.getElementById('activateBtn').disabled = true;
                alert('✅ Игра активирована!');
                
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        function renderQuestions() {
            const list = document.getElementById('questionsList');
            list.innerHTML = QUESTIONS.map((q, i) => `
                <div class="question-item ${i === currentQuestion ? 'active' : ''}" 
                     onclick="selectQuestion(${i})">
                    ${i+1}. ${q.text.substring(0, 30)}...
                </div>
            `).join('');
        }

        function selectQuestion(index) {
            currentQuestion = index;
            renderQuestions();
        }

        async function updatePlayers() {
            if (!gameCode) return;
            
            try {
                const { data, error } = await APP_SUPABASE
                    .from('players')
                    .select('*')
                    .eq('game_code', gameCode);
                
                if (error) throw error;
                
                document.getElementById('playerCount').innerText = data.length;
                
                const list = document.getElementById('playersList');
                list.innerHTML = data.map(p => `
                    <div class="player">
                        👤 ${p.name}<br>
                        🎯 ${p.score || 0}
                    </div>
                `).join('');
                
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }
    </script>
</body>
</html>
